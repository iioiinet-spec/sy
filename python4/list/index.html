<script>const LESSONS=[{"title": "리스트의 의미와 생성", "goal": "여러 데이터를 하나의 이름으로 묶고 리스트 리터럴을 작성한다.", "theory": ["리스트(list)는 여러 값을 순서대로 저장하는 파이썬의 자료형입니다. 대괄호 [ ] 안에 값을 쉼표로 구분하여 넣습니다.", "리스트 안에는 숫자·문자열·불리언 등 서로 다른 자료형도 저장할 수 있지만, 초보 단계에서는 같은 종류의 데이터로 시작하면 이해하기 쉽습니다.", "빈 리스트는 [] 또는 list()로 만듭니다. 리스트의 순서는 보존되며 값은 변경할 수 있습니다."], "analogy": "리스트는 번호가 붙은 서랍장과 같습니다. 서랍 하나하나가 요소(element)이고, 서랍 위치가 인덱스입니다.", "pitfall": "괄호의 종류를 구분하세요. [1, 2]는 리스트이고 (1, 2)는 튜플입니다.", "examples": [{"title": "숫자 리스트 만들기", "code": "scores = [80, 90, 100]\nprint(scores)\nprint(type(scores).__name__)", "explain": "대괄호로 세 개의 점수를 묶어 scores라는 변수에 저장합니다.", "trace": [{"label": "리스트 생성", "values": [80, 90, 100], "mark": [], "note": "scores가 세 숫자를 저장", "result": null}, {"label": "전체 출력", "values": [80, 90, 100], "mark": [], "note": "", "result": "[80, 90, 100]"}, {"label": "자료형 확인", "values": [80, 90, 100], "mark": [], "note": "", "result": "list"}], "stdin": "", "stdout": "[80, 90, 100]\nlist"}, {"title": "빈 리스트에 담기", "code": "basket = []\nbasket.append(\"apple\")\nbasket.append(\"banana\")\nprint(basket)", "explain": "빈 리스트도 하나씩 항목을 추가하여 사용할 수 있습니다.", "trace": [{"label": "빈 리스트", "values": [], "mark": [], "note": "", "result": null}, {"label": "사과 추가", "values": ["apple"], "mark": [0], "note": "", "result": null}, {"label": "바나나 추가", "values": ["apple", "banana"], "mark": [1], "note": "", "result": "['apple', 'banana']"}], "stdin": "", "stdout": "['apple', 'banana']"}], "exercises": [{"title": "정수 3개 묶기", "desc": "세 정수를 한 줄에 입력받아 리스트를 출력하세요.", "stdin": "3 5 7", "stdout": "[3, 5, 7]", "code": "nums = list(map(int, input().split()))\nprint(nums)", "explain": "map(int, ...) 결과를 list(...)로 묶으면 정수 리스트가 됩니다."}, {"title": "빈 리스트와 길이", "desc": "빈 리스트를 만들고 그 길이를 출력하세요.", "stdin": "(입력 없음)", "stdout": "0", "code": "a = []\nprint(len(a))", "explain": "요소가 하나도 없으므로 길이는 0입니다."}], "quiz": {"q": "리스트를 만드는 올바른 표기는?", "options": ["{1, 2, 3}", "[1, 2, 3]", "(1, 2, 3)"], "answer": 1, "why": "[ ]를 사용한 [1, 2, 3]이 리스트입니다."}, "visual": "[80, 90, 100]"}, {"title": "인덱싱과 음수 인덱스", "goal": "리스트의 특정 위치에 접근하고 음수 인덱스를 이해한다.", "theory": ["인덱스는 0부터 시작합니다. 첫 번째 요소는 a[0], 두 번째 요소는 a[1]입니다.", "음수 인덱스 -1은 마지막 요소, -2는 뒤에서 두 번째 요소입니다.", "범위를 벗어난 인덱스를 쓰면 IndexError가 발생합니다."], "analogy": "기차 좌석에 0번부터 번호를 붙였다고 생각해 보세요. 맨 뒤에서부터는 -1, -2로 셀 수도 있습니다.", "pitfall": "요소가 세 개인 리스트에서 a[3]은 네 번째 요소를 뜻하므로 오류입니다.", "examples": [{"title": "앞과 뒤에서 접근", "code": "a = [10, 20, 30, 40]\nprint(a[0])\nprint(a[-1])", "explain": "양수 인덱스는 앞에서, 음수 인덱스는 뒤에서 셉니다.", "trace": [{"label": "원본", "values": [10, 20, 30, 40], "mark": [], "note": "", "result": null}, {"label": "a[0]", "values": [10, 20, 30, 40], "mark": [0], "note": "", "result": "10"}, {"label": "a[-1]", "values": [10, 20, 30, 40], "mark": [3], "note": "", "result": "40"}], "stdin": "", "stdout": "10\n40"}, {"title": "두 요소 교환", "code": "a = [4, 9, 2]\na[0], a[2] = a[2], a[0]\nprint(a)", "explain": "파이썬의 동시 대입으로 두 위치의 값을 교환합니다.", "trace": [{"label": "교환 전", "values": [4, 9, 2], "mark": [0, 2], "note": "", "result": null}, {"label": "교환 후", "values": [2, 9, 4], "mark": [0, 2], "note": "", "result": "[2, 9, 4]"}], "stdin": "", "stdout": "[2, 9, 4]"}], "exercises": [{"title": "양 끝의 합", "desc": "정수 4개를 입력받아 첫 값과 마지막 값의 합을 출력하세요.", "stdin": "3 8 1 6", "stdout": "9", "code": "a = list(map(int, input().split()))\nprint(a[0] + a[-1])", "explain": "0번 인덱스와 -1번 인덱스를 이용합니다."}, {"title": "가운데 요소", "desc": "정수 5개가 입력될 때 가운데 요소를 출력하세요.", "stdin": "9 7 5 3 1", "stdout": "5", "code": "a = list(map(int, input().split()))\nprint(a[2])", "explain": "길이가 5인 리스트의 가운데 인덱스는 2입니다."}], "quiz": {"q": "a=[5,8,2]에서 a[-2]의 값은?", "options": ["5", "8", "2"], "answer": 1, "why": "-1은 마지막인 2, -2는 뒤에서 두 번째인 8입니다."}, "visual": "0  1  2  3 / -4 -3 -2 -1"}, {"title": "슬라이싱으로 부분 리스트 만들기", "goal": "시작·끝·간격을 활용하여 리스트의 일부분을 추출한다.", "theory": ["a[start:end]는 start부터 end 바로 앞까지 가져옵니다. end는 포함하지 않습니다.", "a[::2]처럼 세 번째 자리에는 간격(step)을 쓸 수 있습니다. a[::-1]은 리스트를 역순으로 반환합니다.", "슬라이싱은 새로운 리스트를 만들고, 원본의 요소를 자동 삭제하지 않습니다."], "analogy": "책 2쪽부터 5쪽 직전까지만 복사하는 일과 비슷합니다. 끝 위치는 포함하지 않습니다.", "pitfall": "a[1:3]은 인덱스 1과 2만 포함합니다. a[1:4]와 혼동하지 마세요.", "examples": [{"title": "구간 자르기", "code": "a = [10, 20, 30, 40, 50]\nprint(a[1:4])\nprint(a[:2])", "explain": "끝 인덱스는 포함되지 않습니다.", "trace": [{"label": "원본", "values": [10, 20, 30, 40, 50], "mark": [], "note": "", "result": null}, {"label": "a[1:4]", "values": [10, 20, 30, 40, 50], "mark": [1, 2, 3], "note": "", "result": "[20, 30, 40]"}, {"label": "a[:2]", "values": [10, 20, 30, 40, 50], "mark": [0, 1], "note": "", "result": "[10, 20]"}], "stdin": "", "stdout": "[20, 30, 40]\n[10, 20]"}, {"title": "홀수 위치와 역순", "code": "a = [1, 2, 3, 4, 5, 6]\nprint(a[::2])\nprint(a[::-1])", "explain": "a[::2]는 두 칸 간격으로, a[::-1]은 역순으로 추출합니다.", "trace": [{"label": "원본", "values": [1, 2, 3, 4, 5, 6], "mark": [], "note": "", "result": null}, {"label": "두 칸 간격", "values": [1, 2, 3, 4, 5, 6], "mark": [0, 2, 4], "note": "", "result": "[1, 3, 5]"}, {"label": "역순", "values": [6, 5, 4, 3, 2, 1], "mark": [], "note": "", "result": "[6, 5, 4, 3, 2, 1]"}], "stdin": "", "stdout": "[1, 3, 5]\n[6, 5, 4, 3, 2, 1]"}], "exercises": [{"title": "처음 세 요소", "desc": "공백으로 구분된 정수 5개를 입력받아 처음 3개를 리스트로 출력하세요.", "stdin": "1 2 3 4 5", "stdout": "[1, 2, 3]", "code": "a = list(map(int, input().split()))\nprint(a[:3])", "explain": ":3은 인덱스 0, 1, 2에 해당합니다."}, {"title": "역순 출력", "desc": "한 줄로 받은 정수들을 역순 리스트로 출력하세요.", "stdin": "4 1 9", "stdout": "[9, 1, 4]", "code": "a = list(map(int, input().split()))\nprint(a[::-1])", "explain": "-1 간격으로 슬라이싱하면 역순입니다."}], "quiz": {"q": "a=[1,2,3,4,5]에서 a[1:4]는?", "options": ["[2,3,4]", "[2,3,4,5]", "[1,2,3,4]"], "answer": 0, "why": "시작 1 포함, 끝 4 제외입니다."}, "visual": "a[시작:끝:간격]"}, {"title": "리스트 값 변경과 복사", "goal": "인덱스 수정, 대입 참조와 얕은 복사를 구별한다.", "theory": ["리스트는 변경 가능한(mutable) 자료형이므로 a[1] = 99와 같이 요소를 수정할 수 있습니다.", "b = a는 별도의 리스트를 복사하는 것이 아니라 동일한 리스트를 가리키게 합니다.", "1차원 리스트의 독립된 복사본은 b = a.copy() 또는 a[:]로 만듭니다."], "analogy": "같은 사물함을 가리키는 이름표가 두 개일 수 있습니다. b=a는 사물함을 새로 만드는 것이 아닙니다.", "pitfall": "중첩 리스트의 copy()는 내부 리스트까지 깊게 복사하지 않는 얕은 복사입니다.", "examples": [{"title": "한 칸의 값 바꾸기", "code": "a = [3, 6, 9]\na[1] = 60\nprint(a)", "explain": "두 번째 요소의 값만 60으로 갱신합니다.", "trace": [{"label": "변경 전", "values": [3, 6, 9], "mark": [1], "note": "", "result": null}, {"label": "a[1]=60", "values": [3, 60, 9], "mark": [1], "note": "", "result": "[3, 60, 9]"}], "stdin": "", "stdout": "[3, 60, 9]"}, {"title": "참조와 독립 복사", "code": "a = [1, 2]\nb = a.copy()\nb[0] = 9\nprint(a)\nprint(b)", "explain": "a.copy()를 사용했기 때문에 b를 바꾸어도 a는 그대로입니다.", "trace": [{"label": "복사본 준비", "values": [1, 2], "mark": [], "note": "", "result": null}, {"label": "복사본 수정", "values": [9, 2], "mark": [0], "note": "b의 상태", "result": "[1, 2]\n[9, 2]"}], "stdin": "", "stdout": "[1, 2]\n[9, 2]"}], "exercises": [{"title": "최솟값 대체", "desc": "정수 세 개를 리스트로 받고 가운데 값을 0으로 바꿔 출력하세요.", "stdin": "5 6 7", "stdout": "[5, 0, 7]", "code": "a = list(map(int, input().split()))\na[1] = 0\nprint(a)", "explain": "인덱스를 지정해 직접 수정합니다."}, {"title": "원본 보존하기", "desc": "정수 3개를 입력받아 복사본의 마지막 원소를 100으로 바꿉니다. 원본과 복사본을 각각 출력하세요.", "stdin": "1 2 3", "stdout": "[1, 2, 3]\n[1, 2, 100]", "code": "a = list(map(int, input().split()))\nb = a.copy()\nb[-1] = 100\nprint(a)\nprint(b)", "explain": "복사 후 수정하면 원본은 바뀌지 않습니다."}], "quiz": {"q": "b=a일 때 b[0]을 바꾸면 a[0]은?", "options": ["그대로다", "함께 바뀐다", "리스트가 삭제된다"], "answer": 1, "why": "b=a는 두 이름이 같은 리스트 객체를 참조합니다."}, "visual": "a = [3, 6, 9] → a[1] = 60"}, {"title": "요소 추가: append, extend, insert", "goal": "리스트 끝·중간에 요소를 추가하는 세 메서드를 구별한다.", "theory": ["append(x)는 x 하나를 리스트 끝에 추가합니다. x가 리스트면 중첩 리스트 1개가 추가됩니다.", "extend(iterable)는 반복 가능한 자료의 요소를 하나씩 리스트 끝에 추가합니다.", "insert(i, x)는 인덱스 i 앞에 x를 삽입합니다."], "analogy": "append는 상자 하나를 통째로 넣는 것, extend는 상자를 열어 내용물을 하나씩 넣는 것이라고 생각하세요.", "pitfall": "append([3,4])와 extend([3,4])의 결과는 다릅니다.", "examples": [{"title": "추가와 삽입", "code": "a = [1, 2]\na.append(3)\na.insert(1, 9)\nprint(a)", "explain": "append는 끝에, insert는 지정한 위치 앞에 삽입합니다.", "trace": [{"label": "원본", "values": [1, 2], "mark": [], "note": "", "result": null}, {"label": "append(3)", "values": [1, 2, 3], "mark": [2], "note": "", "result": null}, {"label": "insert(1,9)", "values": [1, 9, 2, 3], "mark": [1], "note": "", "result": "[1, 9, 2, 3]"}], "stdin": "", "stdout": "[1, 9, 2, 3]"}, {"title": "append와 extend 비교", "code": "a = [1, 2]\na.append([3, 4])\nb = [1, 2]\nb.extend([3, 4])\nprint(a)\nprint(b)", "explain": "리스트 자체를 추가할지, 내부 요소를 펼쳐 추가할지 선택합니다.", "trace": [{"label": "a: append", "values": [1, 2, [3, 4]], "mark": [2], "note": "", "result": "[1, 2, [3, 4]]"}, {"label": "b: extend", "values": [1, 2, 3, 4], "mark": [2, 3], "note": "", "result": "[1, 2, 3, 4]"}], "stdin": "", "stdout": "[1, 2, [3, 4]]\n[1, 2, 3, 4]"}], "exercises": [{"title": "값 추가", "desc": "기본 리스트 [1, 2]에 입력받은 정수 하나를 추가해 출력하세요.", "stdin": "7", "stdout": "[1, 2, 7]", "code": "a = [1, 2]\na.append(int(input()))\nprint(a)", "explain": "append를 사용하면 기존 원소 뒤에 추가됩니다."}, {"title": "중간 삽입", "desc": "[10, 20, 30]에 정수 x를 인덱스 1 위치에 삽입해 출력하세요.", "stdin": "15", "stdout": "[10, 15, 20, 30]", "code": "a = [10, 20, 30]\nx = int(input())\na.insert(1, x)\nprint(a)", "explain": "인덱스 1 앞에 새 요소가 들어갑니다."}], "quiz": {"q": "[1,2].append([3,4])의 결과는?", "options": ["[1,2,3,4]", "[1,2,[3,4]]", "[3,4]"], "answer": 1, "why": "append는 전달한 리스트를 요소 하나로 추가합니다."}, "visual": "append / extend / insert"}, {"title": "요소 삭제: pop, remove, del, clear", "goal": "삭제하는 위치와 반환값을 구별한다.", "theory": ["pop(i)는 인덱스 i의 요소를 삭제하고 그 값을 반환합니다. pop()은 마지막 요소를 꺼냅니다.", "remove(x)는 값이 x인 첫 번째 요소를 삭제합니다. 없는 값을 삭제하면 ValueError가 발생합니다.", "del a[i]는 위치를 삭제하고 clear()는 전체 요소를 비웁니다."], "analogy": "pop은 꺼낸 물건을 손에 쥐어 주지만, remove는 지정한 물건을 치우기만 합니다.", "pitfall": "remove(2)는 인덱스 2가 아니라 값 2를 삭제합니다.", "examples": [{"title": "pop의 반환값", "code": "a = [5, 7, 9]\nx = a.pop()\nprint(x)\nprint(a)", "explain": "마지막 값 9를 꺼내 x에 저장합니다.", "trace": [{"label": "원본", "values": [5, 7, 9], "mark": [], "note": "", "result": null}, {"label": "pop() 실행", "values": [5, 7], function pyValue(v){if(typeof v==='string')return "'"+v.replace(/'/g,"\\'")+"'";if(v===null)return 'None';if(v===true)return 'True';if(v===false)return 'False';if(Array.isArray(v))return '['+v.map(pyValue).join(', ')+']';return String(v)}
function renderCells(values, marks=[]){if(!Array.isArray(values))return '<div class="small">시각화할 요소가 없습니다.</div>';if(!values.length)return '<div class="small">[ ] 빈 리스트: 요소가 없습니다.</div>';
if(isMatrix(values))return `<div class="matrix">${values.map((row,r)=>`<div class="matrix-row"><span class="small" style="width:35px">${r}행</span>${row.map((v,c)=>`<div class="value ${marks.includes(r*row.length+c)?'on':''}" title="${r}행 ${c}열">${E(pyValue(v))}</div>`).join('')}</div>`).join('')}</div>`;
return `<div class="cells">${values.map((v,i)=>`<div class="cell"><div class="value ${marks.includes(i)?'on':''}">${E(pyValue(v))}</div><div class="index">${i}</div><div class="index">${i-values.length}</div></div>`).join('')}</div>`}
function resetTimer(){if(timer){clearInterval(timer);timer=null}}
function setView(v){resetTimer();view=v;render();scrollTo({top:0,behavior:'smooth'})}
function changeLesson(i){resetTimer();lessonNo=i;view='lessons';exampleNo=0;stepNo=0;render();scrollTo({top:0,behavior:'smooth'})}
function navHTML(){return '<strong>강의 메뉴</strong>'+LESSONS.map((a,i)=>`<button class="${view==='lessons'&&lessonNo===i?'active':''}" onclick="changeLesson(${i})">${i+1}. ${E(a.title)}</button>`).join('')+'<hr><button class="'+(view==='lab'?'active':'')+'" onclick="setView(\'lab\')">리스트 조작 실습실</button><button class="'+(view==='exam'?'active':'')+'" onclick="setView(\'exam\')">종합평가 · 정답</button>'}
function render(){document.getElementById('nav').innerHTML=navHTML();if(view==='lessons')renderLesson();else if(view==='lab')renderLab();else renderExam()}
function renderLesson(){let l=LESSONS[lessonNo],n=lessonNo+1;
let html=`<section class="hero"><span class="crumb">CHAPTER ${String(n).padStart(2,'0')}</span><h2>${n}. ${E(l.title)}</h2><p class="desc">${E(l.goal)}</p><span class="tag">개념 설명</span><span class="tag">예제 2개</span><span class="tag">연습 2개</span><span class="tag">퀴즈</span></section><section class="panel"><h3>${n}.1 핵심 개념</h3><ol class="numbered">${l.theory.map(t=>'<li>'+E(t)+'</li>').join('')}</ol><div class="quote"><strong>이해를 돕는 비유</strong><p>${E(l.analogy)}</p></div><div class="code">${E(l.visual)}</div><div class="warn"><strong>자주 하는 실수:</strong> ${E(l.pitfall)}</div></section>`;
html+=`<section class="panel"><h3>${n}.2 코드와 그림으로 이해하기</h3><div class="row" style="margin-bottom:12px">${l.examples.map((ex,i)=>`<button class="btn ${i===exampleNo?'primary':''}" onclick="exampleNo=${i};stepNo=0;resetTimer();renderLesson()">예제 ${i+1}: ${E(ex.title)}</button>`).join('')}</div><div id="example" class="exgrid"></div><div class="visual" style="margin-top:14px"><div class="exhead"><strong>리스트 상태 변화 시각화</strong><span class="small" id="stepCount"></span></div><div id="visual"></div><div class="progress"><i id="stepbar"></i></div><div class="controls"><button class="btn" onclick="goStep(-1)">← 이전</button><button class="btn primary" onclick="goStep(1)">다음 단계 →</button><button class="btn" id="autoBtn" onclick="toggleAuto()">자동 재생</button><button class="btn" onclick="stepNo=0;resetTimer();updateSteps()">초기화</button></div></div></section>`;
html+=`<section class="panel"><h3>${n}.3 연습문제</h3><p class="small">입력과 출력 형식을 확인한 후 파이썬 코드를 직접 작성해 보세요. 정답 버튼을 누르면 모범 코드를 펼칠 수 있습니다.</p>${l.exercises.map((x,i)=>`<div class="exercise"><div class="exercise-title">연습 ${n}-${i+1}. ${E(x.title)}</div><p>${E(x.desc)}</p><div class="io"><div><b class="small">예제 입력</b><pre class="code">${E(x.stdin)}</pre></div><div><b class="small">예제 출력</b><pre class="code out">${E(x.stdout)}</pre></div></div><button class="btn" onclick="toggleAnswer('a${i}')">정답 코드 및 해설 보기</button><div class="answer" id="a${i}"><pre class="code">${E(x.code)}</pre><p>${E(x.explain)}</p></div></div>`).join('')}</section>`;
html+=`<section class="panel"><h3>${n}.4 핵심 확인 퀴즈</h3><p><strong>${E(l.quiz.q)}</strong></p><div class="quiz-options">${l.quiz.options.map((o,i)=>`<button class="quizopt ${selectedQuiz[n]===i?'sel':''}" onclick="answerQuiz(${i})">${i+1}. ${E(o)}</button>`).join('')}</div><div id="quizFeed"></div></section><div class="row" style="justify-content:space-between;margin:15px 0 28px"><button class="btn" ${lessonNo===0?'disabled':''} onclick="changeLesson(${lessonNo-1})">← 이전 단원</button><button class="btn primary" ${lessonNo===11?'disabled':''} onclick="changeLesson(${lessonNo+1})">다음 단원 →</button></div>`;
document.getElementById('content').innerHTML=html;renderExample();updateSteps();renderQuizFeed()}
function renderExample(){let e=LESSONS[lessonNo].examples[exampleNo];document.getElementById('example').innerHTML=`<div><h4>${E(e.title)}</h4><p class="small">${E(e.explain)}</p><div class="exhead"><strong>Python 3 코드</strong><button class="btn" onclick="copyExample()">코드 복사</button></div><pre class="code">${E(e.code)}</pre></div><div><h4>실제 실행 출력</h4><pre class="code out">${E(e.stdout||'(출력 없음)')}</pre><div class="quote"><strong>학습 포인트</strong><p>${E(e.explain)}</p></div></div>`}
function copyExample(){let s=LESSONS[lessonNo].examples[exampleNo].code;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>alert('코드를 복사했습니다.')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('코드를 복사했습니다.')}
function goStep(delta){resetTimer();let t=LESSONS[lessonNo].examples[exampleNo].trace;stepNo=Math.max(0,Math.min(t.length-1,stepNo+delta));updateSteps()}
function updateSteps(){let t=LESSONS[lessonNo].examples[exampleNo].trace;if(!t?.length)return;let x=t[stepNo];document.getElementById('stepCount').textContent=`${stepNo+1} / ${t.length} 단계`;
document.getElementById('visual').innerHTML=`<div class="small" style="margin-bottom:10px"><strong>${E(x.label)}</strong></div>${renderCells(x.values,x.mark)}${x.note?`<p class="stepnote">${E(x.note)}</p>`:''}${x.result!==null&&x.result!==undefined?`<div class="small" style="margin:9px 0 4px">이 단계까지의 참고 출력</div><div class="outputbox">${E(x.result)}</div>`:''}`;
document.getElementById('stepbar').style.width=((stepNo+1)/t.length*100)+'%';let b=document.getElementById('autoBtn');if(b)b.textContent=timer?'일시정지':'자동 재생'}
function toggleAuto(){if(timer){resetTimer();updateSteps();return}let t=LESSONS[lessonNo].examples[exampleNo].trace;if(stepNo>=t.length-1)stepNo=0;timer=setInterval(()=>{if(stepNo>=t.length-1){resetTimer();updateSteps();return}stepNo++;updateSteps()},1200);updateSteps()}
function answerQuiz(i){selectedQuiz[lessonNo+1]=i;renderQuizFeed()}
function renderQuizFeed(){let k=lessonNo+1,x=LESSONS[lessonNo].quiz;document.querySelectorAll('.quizopt').forEach((e,i)=>e.classList.toggle('sel',selectedQuiz[k]===i));let el=document.getElementById('quizFeed');if(selectedQuiz[k]===undefined){el.innerHTML='';return}let good=selectedQuiz[k]===x.answer;el.innerHTML=`<div class="feedback ${good?'':'bad'}">${good?'정답입니다.':'다시 확인하세요.'} ${E(x.why)}</div>`}
const pyClone=a=>JSON.parse(JSON.stringify(a));
function parseArray(txt){txt=txt.trim();if(!txt)throw Error('리스트를 입력하세요.');let a;try{a=JSON.parse(txt)}catch(err){let cells=txt.split(',').map(z=>z.trim()).filter(Boolean);if(!cells.length)throw Error('빈 리스트는 []로 입력하세요.');a=cells.map(z=>/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(z)?Number(z):z)}if(!Array.isArray(a))throw Error('JSON 배열 [10,20,30] 또는 쉼표 목록을 입력하세요.');if(a.length>45)throw Error('최대 45개 요소까지만 표시합니다.');return a}
function readAtom(v){v=v.trim();if(!v)throw Error('값을 입력하세요.');try{return JSON.parse(v)}catch(e){return v}}
function initLab(){let v=document.getElementById('listStart').value;try{labValues=parseArray(v);labHistory=['입력 리스트: '+pyValue(labValues)];labNotice('입력값을 불러왔습니다.');renderLabState()}catch(e){labNotice(e.message,true)}}
function labNotice(s,bad=false){let el=document.getElementById('labNotice');if(el){el.textContent=s;el.style.color=bad?'#ab4d31':'#12664d'}}
function labAction(action){let iStr=document.getElementById('operationIndex').value.trim(),vStr=document.getElementById('operationValue').value;
 let before=pyClone(labValues), a=pyClone(labValues),message='';
 try{let idx=iStr===''?undefined:Number(iStr);if(idx!==undefined&&(!Number.isInteger(idx)||!Number.isSafeInteger(idx)))throw Error('인덱스는 정수여야 합니다.');
 let value=['append','extend','insert','remove','count','in'].includes(action)?readAtom(vStr):null;
 if(action==='append'){a.push(value);message='append: 요소 한 개 추가'}
 else if(action==='extend'){if(!Array.isArray(value))throw Error('extend의 값에는 [3,4]처럼 배열을 입력하세요.');a.push(...value);message='extend: 여러 요소 펼쳐 추가'}
 else if(action==='insert'){if(idx===undefined)throw Error('삽입 위치를 입력하세요.');a.splice(Math.max(0,idx<0?a.length+idx:idx),0,value);message='insert: 지정 위치 앞에 추가'}
 else if(action==='pop'){if(!a.length)throw Error('빈 리스트에서는 pop을 사용할 수 없습니다.');let p=idx===undefined?a.length-1:idx<0?a.length+idx:idx;if(p<0||p>=a.length)throw Error('pop 인덱스가 범위 밖입니다.');let out=a.splice(p,1)[0];message='pop 결과: '+pyValue(out)}
 else if(action==='remove'){let p=a.findIndex(x=>JSON.stringify(x)===JSON.stringify(value));if(p<0)throw Error('삭제할 값이 없습니다(ValueError).');a.splice(p,1);message='remove: 첫 번째 일치 값을 삭제'}
 else if(action==='sortAsc'||action==='sortDesc'){if(!a.every(x=>typeof x==='number'&&Number.isFinite(x)))throw Error('정렬 실습은 숫자 리스트만 지원합니다.');a.sort((x,y)=>action==='sortAsc'?x-y:y-x);message=action==='sortAsc'?'오름차순 sort':'내림차순 sort'}
 else if(action==='reverse'){a.reverse();message='reverse: 순서를 뒤집음'}
 else if(action==='clear'){a=[];message='clear: 모든 요소 삭제'}
 else if(action==='sum'){if(!a.every(x=>typeof x==='number'))throw Error('sum 실습은 숫자만 지원합니다.');message='sum = '+a.reduce((x,y)=>x+y,0)}
 else if(action==='count'){message='count = '+a.filter(x=>JSON.stringify(x)===JSON.stringify(value)).length}
 else if(action==='in'){message='값 포함 여부 = '+(a.some(x=>JSON.stringify(x)===JSON.stringify(value))?'True':'False')}
 else if(action==='slice'){let start=document.getElementById('sliceStart').value.trim(),end=document.getElementById('sliceEnd').value.trim(),stride=document.getElementById('sliceStride').value.trim();let s=start===''?null:Number(start),e=end===''?null:Number(end),k=stride===''?1:Number(stride);if([s,e,k].some(x=>x!==null&&!Number.isInteger(x)))throw Error('시작·끝·간격은 정수로 입력하세요.');if(k===0)throw Error('슬라이싱 간격은 0일 수 없습니다.');let indexes=[];let len=a.length;let norm=(v,def)=>v===null?def:(v<0?v+len:v);if(k>0){let from=Math.max(0,Math.min(len,norm(s,0))),to=Math.max(0,Math.min(len,norm(e,len)));for(let z=from;z<to;z+=k)indexes.push(z)}else{let from=s===null?len-1:Math.min(len-1,Math.max(-1,norm(s,len-1))),to=e===null?-1:Math.min(len-1,Math.max(-1,norm(e,-1)));for(let z=from;z>to;z+=k)indexes.push(z)}a=indexes.map(z=>a[z]);message='슬라이싱 결과: '+pyValue(a)}
 if(a.length>45)throw Error('표시 개수 제한(45)을 초과합니다.');labValues=a;labHistory.push(message+'\n  변경 전 '+pyValue(before)+'\n  변경 후 '+pyValue(a));if(labHistory.length>35)labHistory.shift();labNotice(message);renderLabState()
 }catch(err){labNotice(err.message,true)}}
function labUndo(){if(labHistory.length<2){labNotice('되돌릴 이전 기록이 없습니다.',true);return}labHistory.pop();let rec=labHistory[labHistory.length-1];let txt=rec.match(/변경 후 (\[.*\])$/m)?.[1]||rec.match(/입력 리스트: (\[.*\])$/m)?.[1];if(txt){try{labValues=JSON.parse(txt.replace(/'/g,'"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null'))}catch(err){labValues=[10,20,30,40]}}renderLabState();labNotice('이전 상태로 돌아왔습니다.')}
function renderLabState(){let el=document.getElementById('labView');if(!el)return;el.innerHTML=renderCells(labValues);document.getElementById('labString').textContent=pyValue(labValues);document.getElementById('labHistory').textContent=labHistory.join('\n\n')}
function renderLab(){document.getElementById('content').innerHTML=`<section class="hero"><div class="crumb">LIVE PRACTICE</div><h2>리스트 조작 실습실</h2><p class="desc">학생이 값을 바꿔 append, insert, pop, remove, sort, slice 등의 결과를 직접 비교할 수 있습니다. 임의의 Python 코드를 실행하는 기능은 아닙니다.</p></section><section class="panel"><h3>1. 시작 리스트 만들기</h3><div class="row"><input class="field" id="listStart" style="flex:1" value="[10, 20, 30, 40]" aria-label="리스트 입력"><button class="btn primary" onclick="initLab()">리스트 만들기</button></div><p class="small">[10, 20, 30] 또는 10,20,30 / ["apple", "banana"] 형태로 입력할 수 있습니다.</p><div id="labNotice" class="status"></div><div class="visual"><div id="labView"></div><p class="small">현재 리스트</p><div class="outputbox" id="labString"></div></div></section><section class="panel"><h3>2. 조작하기</h3><div class="pad"><div class="cols"><div><label for="operationValue">조작할 값</label><input class="field" id="operationValue" value="99" aria-label="조작할 값"><p class="small">문자열: "apple" / 여러 값: [3,4]</p></div><div><label for="operationIndex">인덱스 (insert, pop)</label><input class="field" id="operationIndex" type="number" value="1" aria-label="인덱스"><p class="small">pop() 끝 요소를 꺼내려면 인덱스를 비우세요.</p></div></div><div class="operation-buttons">${[['append','append'],['extend','extend'],['insert','insert'],['pop','pop'],['remove','remove'],['sortAsc','sort ↑'],['sortDesc','sort ↓'],['reverse','reverse'],['clear','clear'],['sum','sum'],['count','count'],['in','in 포함?']].map(z=>`<button class="btn" onclick="labAction('${z[0]}')">${z[1]}</button>`).join('')}</div><h4>슬라이싱 슬라이더 대신 정확한 인덱스로 연습</h4><div class="row"><div style="flex:1"><label>시작</label><input class="field" id="sliceStart" value="1"></div><div style="flex:1"><label>끝 (미포함)</label><input class="field" id="sliceEnd" value="3"></div><div style="flex:1"><label>간격</label><input class="field" id="sliceStride" value="1"></div><button class="btn primary" onclick="labAction('slice')">슬라이싱 적용</button></div></div><div class="controls" style="margin-top:14px"><button class="btn" onclick="labUndo()">한 단계 되돌리기</button><button class="btn" onclick="labValues=[10,20,30,40];labHistory=['초기 리스트: [10, 20, 30, 40]'];renderLabState();labNotice('초기화했습니다.')">전체 초기화</button></div></section><section class="panel"><h3>3. 상태 변화 기록</h3><div class="history" id="labHistory"></div></section>`;renderLabState()}
function renderExam(){let html=`<section class="hero"><div class="crumb">PRACTICE TEST</div><h2>정보올림피아드 실전 종합평가</h2><p class="desc">기본 문제에서 2차원 리스트와 누적합까지, 10개 문제의 예제 입력과 출력을 확인한 뒤 정답을 열어 비교해 보세요.</p></section><section class="panel">`;
EXAM.forEach((x,i)=>html+=`<div class="exercise"><div class="exercise-title">${i+1}. ${E(x[0])}</div><p>${E(x[1])}</p><div class="io"><div><b class="small">입력</b><pre class="code">${E(x[2])}</pre></div><div><b class="small">출력</b><pre class="code out">${E(x[3])}</pre></div></div><button class="btn" onclick="toggleAnswer('exam${i}')">정답 / 해설 확인</button><div class="answer" id="exam${i}"><pre class="code">${E(x[4])}</pre><p>${E(x[5])}</p></div></div>`);html+='</section>';document.getElementById('content').innerHTML=html}
function toggleAnswer(id){document.getElementById(id)?.classList.toggle('show')}
function doPrint(scope,solutions){resetTimer();showSolutions=solutions;let items=scope==='all'?LESSONS:[LESSONS[lessonNo]];let header=`<h1>파이썬 리스트(List) 개념·예제·문제풀이</h1><p>세영코딩연구소 · 저자 Ph.D KIM | ${scope==='all'?'전체 12개 단원':'단원 '+(lessonNo+1)} | 정답 ${solutions?'포함':'제외'}</p>`;
let body=items.map((l,j)=>{let index=scope==='all'?j+1:lessonNo+1;return `<section class="${j?'pagebreak':''}"><h2>${index}. ${E(l.title)}</h2><p><b>학습 목표:</b> ${E(l.goal)}</p><h3>1. 핵심 개념</h3>${l.theory.map((t,k)=>`<p>${k+1}. ${E(t)}</p>`).join('')}<p class="note"><b>비유:</b> ${E(l.analogy)}</p><pre>${E(l.visual)}</pre><p><b>주의:</b> ${E(l.pitfall)}</p><h3>2. 예제 코드</h3>${l.examples.map((x,i)=>`<div class="printbox"><b>예제 ${i+1}. ${E(x.title)}</b><p>${E(x.explain)}</p><pre>${E(x.code)}</pre><b>실행 결과</b><pre>${E(x.stdout)}</pre><b>단계별 상태</b>${x.trace.map(t=>`<p>${E(t.label)} → ${E(pyValue(t.values))}${t.note?' / '+E(t.note):''}</p>`).join('')}</div>`).join('')}<h3>3. 연습문제</h3>${l.exercises.map((x,i)=>`<div class="printbox"><b>${index}-${i+1}. ${E(x.title)}</b><p>${E(x.desc)}</p><table><tr><th>입력</th><th>출력</th></tr><tr><td><pre>${E(x.stdin)}</pre></td><td><pre>${E(x.stdout)}</pre></td></tr></table>${solutions?`<b>정답 코드</b><pre>${E(x.code)}</pre><p>해설: ${E(x.explain)}</p>`:''}</div>`).join('')}<h3>4. 단원 확인 퀴즈</h3><p>${E(l.quiz.q)}</p>${l.quiz.options.map((o,k)=>`<p>${k+1}. ${E(o)}</p>`).join('')}${solutions?`<p>정답: ${l.quiz.answer+1} / ${E(l.quiz.why)}</p>`:''}</section>`}).join('');
if(scope==='all')body+=`<section class="pagebreak"><h2>13. 정보올림피아드 실전 종합평가</h2>${EXAM.map((x,i)=>`<div class="printbox"><b>${i+1}. ${E(x[0])}</b><p>${E(x[1])}</p><table><tr><th>입력</th><th>출력</th></tr><tr><td><pre>${E(x[2])}</pre></td><td><pre>${E(x[3])}</pre></td></tr></table>${solutions?`<b>정답 코드</b><pre>${E(x[4])}</pre><p>${E(x[5])}</p>`:''}</div>`).join('')}</section>`;
document.getElementById('printBook').innerHTML=header+body;setTimeout(()=>window.print(),60)}
window.addEventListener('beforeprint',()=>{if(!document.getElementById('printBook').innerHTML)doPrint('chapter',false)});
window.addEventListener('keydown',e=>{if(view==='lessons'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight'){goStep(1)}if(e.key==='ArrowLeft'){goStep(-1)}}});
render();</script></body></html>
